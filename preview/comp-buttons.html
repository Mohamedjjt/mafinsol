<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_card.css">
<style>
body { padding:26px; }
.row3 { display:flex; gap:14px; align-items:center; flex-wrap:wrap; margin-bottom:16px; }
.btn { display:inline-flex; align-items:center; gap:9px; font-family:'Manrope',sans-serif;
  font-size:13px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase;
  padding:13px 26px; border-radius:2px; border:none; cursor:pointer; }
.solid-f { background:#0a2342; color:#fff; }
.solid-c { background:#0d4f5c; color:#fff; }
.accent-f { background:#c9a961; color:#fff; }
.accent-c { background:#16a394; color:#fff; }
.ghost { background:transparent; color:#0a2342; border:1.5px solid #d6dce8; }
.cap2 { font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#aab2c2;margin:2px 0 9px; }
</style></head>
<body>
<div class="cap2">Finance</div>
<div class="row3">
  <button class="btn solid-f">Opdracht bespreken
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="btn accent-f">Verstuur verzoek</button>
  <button class="btn ghost">Meer lezen</button>
</div>
<div class="cap2">Care</div>
<div class="row3">
  <button class="btn solid-c">Opdracht bespreken
    <svg width="15" height="15" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
  <button class="btn accent-c">Verstuur verzoek</button>
  <button class="btn ghost" style="color:#0d4f5c;border-color:#d3e4e3;">Meer lezen</button>
</div>
</body></html>
