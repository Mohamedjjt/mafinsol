<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_card.css">
<style>
.sw { display:flex; flex-direction:column; }
.chip { height:54px; border-radius:4px; border:1px solid rgba(255,255,255,0.08); }
.sw .name { font-size:11px; font-weight:700; margin-top:7px; color:#e8edf5; }
.sw .hex { font-family:ui-monospace,Menlo,monospace; font-size:10.5px; color:#8a9ab5; }
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:13px; }
.lbl { font-size:10px; font-weight:700; letter-spacing:0.14em; text-transform:uppercase; color:#8a9ab5; margin-bottom:12px; }
body { background:#0b1320; }
.block + .block { margin-top:18px; }
</style></head>
<body>
<div class="block">
  <div class="lbl">Finance · Dark</div>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#0d1520"></div><span class="name">BG</span><span class="hex">#0d1520</span></div>
    <div class="sw"><div class="chip" style="background:#111e2e"></div><span class="name">Surface</span><span class="hex">#111e2e</span></div>
    <div class="sw"><div class="chip" style="background:#c9a961"></div><span class="name">Accent</span><span class="hex">#c9a961</span></div>
    <div class="sw"><div class="chip" style="background:#1e3050"></div><span class="name">Border</span><span class="hex">#1e3050</span></div>
  </div>
</div>
<div class="block">
  <div class="lbl">Care · Dark</div>
  <div class="grid">
    <div class="sw"><div class="chip" style="background:#0a1416"></div><span class="name">BG</span><span class="hex">#0a1416</span></div>
    <div class="sw"><div class="chip" style="background:#0f1e20"></div><span class="name">Surface</span><span class="hex">#0f1e20</span></div>
    <div class="sw"><div class="chip" style="background:#16a394"></div><span class="name">Accent</span><span class="hex">#16a394</span></div>
    <div class="sw"><div class="chip" style="background:#1e3538"></div><span class="name">Border</span><span class="hex">#1e3538</span></div>
  </div>
</div>
</body></html>
