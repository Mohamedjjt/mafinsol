<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Manrope:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_card.css">
<style>
body { padding:24px; background:#f4f6fa; }
.panel { position:relative; background:#0a2342; border-radius:4px; padding:26px 28px; max-width:360px; overflow:hidden; }
.panel::after { content:''; position:absolute; bottom:-30px; right:-30px; width:120px; height:120px; border-radius:50%; background:#c9a961; opacity:0.15; }
.stat { padding-bottom:16px; margin-bottom:16px; border-bottom:1px solid rgba(255,255,255,0.12); }
.stat:last-child { border:none; margin:0; padding:0; }
.num { font-family:'Playfair Display',serif; font-size:38px; font-weight:700; line-height:1; color:#c9a961; margin-bottom:5px; }
.lab { font-family:'Manrope',sans-serif; font-size:13px; color:rgba(255,255,255,0.75); line-height:1.4; }
</style></head>
<body>
<div class="panel">
  <div class="stat"><div class="num">4+</div><div class="lab">jaar actief in interim finance</div></div>
  <div class="stat"><div class="num">Top 50</div><div class="lab">opdrachtgevers in portefeuille</div></div>
  <div class="stat"><div class="num">SAP</div><div class="lab">S/4HANA · ECC · REFX migratie-ervaring</div></div>
</div>
</body></html>
