<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_card.css">
<style>
body { padding:28px 26px; display:flex; gap:34px; align-items:center; }
.unit { display:flex; flex-direction:column; align-items:center; gap:12px; }
img { width:60px; height:60px; border-radius:13px; }
.cap2 { font-size:11px;font-weight:700;color:#1c2430; }
.sub { font-family:ui-monospace,Menlo,monospace; font-size:10px; color:#8a93a6; }
.dot { display:flex; align-items:center; gap:7px; font-size:11px; color:#5a6680; }
.d { width:11px; height:11px; border-radius:50%; }
</style></head>
<body>
<div class="unit"><img src="../assets/favicon.svg"><span class="cap2">Finance favicon</span><span class="dot"><span class="d" style="background:#c9a961;"></span>gold dot</span></div>
<div class="unit"><img src="../assets/favicon-care.svg"><span class="cap2">Care favicon</span><span class="dot"><span class="d" style="background:#16a394;"></span>teal dot</span></div>
<div class="unit" style="align-items:flex-start;max-width:230px;">
  <span class="cap2">The monogram</span>
  <span class="sub" style="line-height:1.7;">Letters <b style="color:#1c2430;">MA</b> + a single coloured dot. Gold = Finance, teal = Care. The dot is the only brand-variable element of the mark.</span>
</div>
</body></html>
