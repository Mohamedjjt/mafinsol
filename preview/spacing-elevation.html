<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_card.css">
<style>
body { padding:30px 26px; background:#f4f6fa; }
.grid { display:grid; grid-template-columns:repeat(3,1fr); gap:22px; }
.box { display:flex; flex-direction:column; align-items:center; gap:12px; }
.e { width:120px; height:66px; background:#fff; border:1px solid #d6dce8; border-radius:4px; }
.lab { font-size:12px; font-weight:700; color:#1c2430; }
.sub { font-family:ui-monospace,Menlo,monospace; font-size:10px; color:#8a93a6; text-align:center; }
</style></head>
<body>
<div class="grid">
  <div class="box"><div class="e"></div><span class="lab">Rest</span><span class="sub">no shadow · 1px border</span></div>
  <div class="box"><div class="e" style="box-shadow:0 8px 28px rgba(0,0,0,0.06);"></div><span class="lab">Hover · soft</span><span class="sub">0 8px 28px / .06</span></div>
  <div class="box"><div class="e" style="box-shadow:0 12px 36px rgba(0,0,0,0.12);transform:translateY(-4px);"></div><span class="lab">Hover · lift</span><span class="sub">−4px · 0 12px 36px / .12</span></div>
</div>
</body></html>
