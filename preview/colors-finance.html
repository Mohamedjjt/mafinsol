<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../colors_and_type.css">
<link rel="stylesheet" href="_card.css">
<style>
.sw { display:flex; flex-direction:column; }
.chip { height:64px; border-radius:4px; border:1px solid rgba(0,0,0,0.06); }
.sw .name { font-size:11px; font-weight:700; margin-top:7px; color:#1c2430; }
.sw .hex { font-family:ui-monospace,Menlo,monospace; font-size:10.5px; color:#8a93a6; letter-spacing:0.02em; }
.grid { display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
</style></head>
<body>
<div class="grid">
  <div class="sw"><div class="chip" style="background:#0a2342"></div><span class="name">Primary</span><span class="hex">#0a2342</span></div>
  <div class="sw"><div class="chip" style="background:#c9a961"></div><span class="name">Accent · Gold</span><span class="hex">#c9a961</span></div>
  <div class="sw"><div class="chip" style="background:#081b33"></div><span class="name">Dark BG</span><span class="hex">#081b33</span></div>
  <div class="sw"><div class="chip" style="background:#f4f6fa"></div><span class="name">Page BG</span><span class="hex">#f4f6fa</span></div>
  <div class="sw"><div class="chip" style="background:#ffffff"></div><span class="name">Surface</span><span class="hex">#ffffff</span></div>
  <div class="sw"><div class="chip" style="background:#1c2430"></div><span class="name">Text</span><span class="hex">#1c2430</span></div>
  <div class="sw"><div class="chip" style="background:#5a6680"></div><span class="name">Muted</span><span class="hex">#5a6680</span></div>
  <div class="sw"><div class="chip" style="background:#e8ecf5"></div><span class="name">Tag BG</span><span class="hex">#e8ecf5</span></div>
</div>
</body></html>
