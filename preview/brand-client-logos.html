<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_card.css">
<style>
body { padding:24px; background:#f4f6fa; }
.cap2 { font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#aab2c2;margin-bottom:14px; }
.row { display:flex; gap:12px; flex-wrap:wrap; align-items:stretch; }
.tile { background:#fff; border:1px solid #d6dce8; border-radius:4px; padding:14px 16px; display:flex; align-items:center; justify-content:center; height:60px; }
.tile img { height:30px; width:auto; max-width:120px; }
.tile.tall img { height:34px; }
</style></head>
<body>
<div class="cap2">Client / reference logos · white tiles · 4px · 1px border</div>
<div class="row">
  <div class="tile"><img src="../assets/logos/asml.svg"></div>
  <div class="tile"><img src="../assets/logos/philips.svg"></div>
  <div class="tile"><img src="../assets/logos/jumbo.svg"></div>
  <div class="tile tall"><img src="../assets/logos/van-loon-group.svg"></div>
  <div class="tile"><img src="../assets/logos/helderzorg.png"></div>
</div>
</body></html>
