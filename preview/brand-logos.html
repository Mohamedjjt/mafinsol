<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link rel="stylesheet" href="_card.css">
<style>
body { padding:0; }
.grid { display:grid; grid-template-columns:1fr 1fr; }
.cell { padding:30px 28px; display:flex; flex-direction:column; gap:8px; }
.light { background:#fff; } .dark { background:#0a2342; } .darkc { background:#0d4f5c; } .lightc { background:#f0f7f7; }
.cap2 { font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase; }
.cap-l { color:#aab2c2; } .cap-d { color:rgba(255,255,255,0.5); }
img { height:40px; width:auto; }
</style></head>
<body>
<div class="grid">
  <div class="cell light"><span class="cap2 cap-l">MA Financial · on light</span><img src="../assets/logos/ma-financial-solutions.svg"></div>
  <div class="cell dark"><span class="cap2 cap-d">on navy</span><img src="../assets/logos/ma-financial-solutions-light.svg"></div>
  <div class="cell lightc"><span class="cap2 cap-l">MA Care · on light</span><img src="../assets/logos/ma-care-solutions.svg"></div>
  <div class="cell darkc"><span class="cap2 cap-d">on teal</span><img src="../assets/logos/ma-care-solutions-light.svg"></div>
</div>
</body></html>
