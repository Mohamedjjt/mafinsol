<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="_card.css">
<style>
body { padding:26px; }
.bar { display:flex; align-items:center; gap:14px; margin-bottom:14px; }
.swatch { background:#c9a961; height:18px; border-radius:2px; }
.tok { font-family:ui-monospace,Menlo,monospace; font-size:11px; color:#1c2430; width:230px; }
.val { font-family:ui-monospace,Menlo,monospace; font-size:10.5px; color:#8a93a6; }
</style></head>
<body>
<div class="bar"><span class="tok">--radius-sharp / card / pill</span><div class="swatch" style="width:8px;"></div><span class="val">2 / 4 / 6 px</span></div>
<div class="bar"><span class="tok">--section-pad</span><div class="swatch" style="width:128px;"></div><span class="val">clamp(4rem, 8vw, 8rem)</span></div>
<div class="bar"><span class="tok">--max-w</span><div class="swatch" style="width:236px;"></div><span class="val">1180px content width</span></div>
<div class="bar"><span class="tok">side padding</span><div class="swatch" style="width:40px;"></div><span class="val">clamp(1.25rem, 4vw, 2.5rem)</span></div>
<div class="bar"><span class="tok">--fade</span><div class="swatch" style="width:56px;"></div><span class="val">350ms ease · brand/theme</span></div>
</body></html>
