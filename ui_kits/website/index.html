<style>
  /* Refined toggle treatment (carried from the design-system review) */
  .pill-toggle { display: inline-grid; grid-template-columns: 1fr 1fr; background: #fff;
    border: 1px solid var(--border); border-radius: 8px; padding: 4px; box-shadow: 0 1px 2px rgba(10,35,66,0.05); }
  .dark .pill-toggle { background: var(--surface); }
  .pill-indicator { top: 4px; bottom: 4px; left: 4px; width: calc(50% - 4px); border-radius: 5px; }
  .care .pill-indicator { transform: translateX(100%); }
  .pill-option { min-width: 0; padding: 9px 22px; text-align: center; }
  .dark-toggle svg { width: 16px; height: 16px; }
  .dark-toggle.active { color: var(--accent); }
</style>
