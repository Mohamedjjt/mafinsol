<!DOCTYPE html><html lang="nl"><head><meta charset="utf-8">
<link rel="stylesheet" href="/assets/fonts/fonts.css">
<style>
*{box-sizing:border-box;margin:0}
body{width:1200px;height:630px;font-family:'Manrope',sans-serif;color:#fff;display:flex;flex-direction:column;justify-content:space-between;padding:64px 80px;background:var(--bg)}
body.finance{--bg:#0a2342;--acc:#c9a961}
body.care{--bg:#0d4f5c;--acc:#16a394}
.brand{display:flex;align-items:center;gap:18px;font-size:26px;letter-spacing:.2em;text-transform:uppercase;font-weight:600}
.brand b{font-family:'Helvetica Neue',Arial,sans-serif;font-size:56px;letter-spacing:-1px;font-weight:600}
.dot{width:14px;height:14px;border-radius:50%;background:var(--acc)}
h1{font-family:'Playfair Display',serif;font-weight:700;font-size:68px;line-height:1.12;max-width:980px}
.foot{display:flex;justify-content:space-between;font-size:26px;color:rgba(255,255,255,.75)}
.foot span:last-child{color:var(--acc);font-weight:700}
</style></head><body>
<div class="brand"><b>MA</b><i class="dot"></i><span id="b"></span></div>
<h1 id="h"></h1>
<div class="foot"><span id="s"></span><span>mafinsol.nl</span></div>
<script>
const q=new URLSearchParams(location.search),k=q.get('k')||'finance';
document.body.className=k;
const d={finance:['Financial Solutions','Interim Financial Controller en SAP-specialist','Eindhoven · Nederland & internationaal'],
         care:['Care Solutions','Ambulante begeleiding en gehandicaptenzorg','Noord-Brabant · Limburg · landelijk']}[k];
document.getElementById('b').textContent=d[0];document.getElementById('h').textContent=d[1];document.getElementById('s').textContent=d[2];
</script></body></html>
